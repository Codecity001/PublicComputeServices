name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract libsekret.so from official release
        run: |
          curl -fL -s -o /tmp/pcs.apk "https://github.com/KieronQuinn/PublicComputeServices/releases/download/1.0.6/PublicComputeServices-v1.0.6.apk"
          unzip -q /tmp/pcs.apk "lib/*/libsekret.so" -d /tmp/pcs_extracted
          mkdir -p app/src/main/jniLibs
          cp -r /tmp/pcs_extracted/lib/* app/src/main/jniLibs/

      - name: Configure Keystore (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            cat <<EOF >> local.properties
          storeFile=${GITHUB_WORKSPACE}/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          fi

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/*.apk PublicComputeServices-v1.0.6.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-build.${{ github.run_number }}
          name: PublicComputeServices v1.0.6 (Build #${{ github.run_number }})
          files: PublicComputeServices-v1.0.6.apk
          generate_release_notes: true
